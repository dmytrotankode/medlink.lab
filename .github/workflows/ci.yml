name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: .NET build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore MedLink.LIS.sln
      - name: Build
        run: dotnet build MedLink.LIS.sln -c Release --no-restore
      - name: Test
        run: dotnet test MedLink.LIS.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  frontend:
    name: Quasar SPA build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/MedLink.LIS.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/MedLink.LIS.Web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: spa
          path: src/MedLink.LIS.Web/dist/spa

  connector-publish:
    name: Connector self-contained publish
    runs-on: ubuntu-latest
    needs: backend
    strategy:
      matrix:
        rid: [win-x64, linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: dotnet publish src/MedLink.LabConnector/MedLink.LabConnector.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o artifacts/labconnector/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: labconnector-${{ matrix.rid }}
          path: artifacts/labconnector/${{ matrix.rid }}
