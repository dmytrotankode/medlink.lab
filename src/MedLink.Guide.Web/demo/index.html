<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>MedLink Guide — демо</title>
<style>
  body{font-family:'Segoe UI',Arial,sans-serif;margin:0;background:#f4f6f9;color:#1f2937}
  header{background:#fff;border-bottom:1px solid #e5e7eb;padding:10px 20px;display:flex;gap:16px;align-items:center}
  header b{flex:1} nav a{margin-right:12px;color:#2f7de1;cursor:pointer;text-decoration:none}
  main{max-width:760px;margin:24px auto;background:#fff;padding:24px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .field{margin-bottom:14px} label{display:block;font-size:13px;color:#6b7280;margin-bottom:3px}
  input,select{padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;width:280px}
  button.b{padding:8px 16px;border:0;background:#2f7de1;color:#fff;border-radius:6px;cursor:pointer}
  table{border-collapse:collapse;width:100%} td,th{border-bottom:1px solid #e5e7eb;padding:8px;text-align:left}
</style>
</head>
<body>
<header>
  <b>Демо-система (будь-який фронтенд)</b>
  <nav><a data-testid="nav-orders" href="#/orders">Замовлення</a><a data-testid="nav-new" href="#/orders/new">Нове замовлення</a></nav>
  <span id="slot"></span>
</header>
<main id="view"></main>

<script type="module">
import MedLinkGuide from '../src/index.js';

const views = {
  '/orders': () => `<h2>Замовлення</h2><div data-testid="orders-toolbar"><button class="b" data-testid="btn-new-order" onclick="location.hash='#/orders/new'">+ Нове замовлення</button></div>
    <table data-testid="orders-table"><tr><th>№</th><th>Пацієнт</th><th>Статус</th></tr><tr><td>1001</td><td>Мельник І.</td><td>Новий</td></tr><tr><td>1002</td><td>Шевчук О.</td><td>Готово</td></tr></table>`,
  '/orders/new': () => `<h2>Нове замовлення</h2>
    <div class="field" data-testid="patient-block"><label>Пацієнт</label><input data-testid="patient-input" placeholder="Прізвище"></div>
    <div class="field"><label>Пріоритет</label><select data-testid="priority-select"><option>Плановий</option><option>CITO</option></select></div>
    <button class="b" data-testid="btn-save-order" onclick="alert('Збережено (демо)');location.hash='#/orders'">Зберегти</button>`
};
const route = () => location.hash.replace(/^#/, '') || '/orders';
const render = () => { document.getElementById('view').innerHTML = (views[route()] || views['/orders'])(); };
window.addEventListener('hashchange', render); render();

const seed = { folders: [{ id: 'f1', caption: 'Замовлення', icon: '🧾', sortOrder: 0 }], scenarios: [] };
const guide = MedLinkGuide.init({
  appCode: 'demo', appCaption: 'Демо', apiBase: '/api/v1/guide', memory: !new URLSearchParams(location.search).has('api'), seed: seed,
  navigate: r => { location.hash = '#' + r; }, currentRoute: route,
  canEdit: () => true, getRole: () => ''
});
window.guide = guide;
</script>
</body>
</html>
