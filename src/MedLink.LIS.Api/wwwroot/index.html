<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedLink LIS 4.0</title>
  <style>
    body { font-family: "Source Sans Pro", Segoe UI, Arial, sans-serif; background: #f4f6f9; color: #212121; margin: 0; }
    .wrap { max-width: 720px; margin: 10vh auto; background: #fff; border-radius: 8px; padding: 32px 40px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { color: #4274A7; margin-top: 0; }
    .bar { height: 6px; border-radius: 3px; background: linear-gradient(90deg, #0178BC, #318F94, #5EC58C); margin-bottom: 24px; }
    a { color: #0178BC; }
    code { background: #eef2f7; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar"></div>
    <h1>MedLink LIS 4.0 — API працює</h1>
    <p>Фронтенд (Quasar SPA) ще не зібрано. Після збірки <code>quasar build</code> скопіюйте <code>dist/spa</code> у <code>wwwroot</code>.</p>
    <ul>
      <li><a href="/swagger">Swagger UI</a> — документація REST API</li>
      <li><a href="/health">/health</a> — стан сервісу та БД</li>
      <li><a href="/api/v1/lab/worklist">/api/v1/lab/worklist</a> — робочий лист</li>
      <li><a href="/api/v1/lab/orders">/api/v1/lab/orders</a> — замовлення</li>
    </ul>
  </div>
</body>
</html>
