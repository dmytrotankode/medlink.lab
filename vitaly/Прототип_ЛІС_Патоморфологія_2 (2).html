.pill.r{color:var(--red);border-color:#F2B3AE;background:#FFF5F4}.pill.a{color:#8A5A00;border-color:#EBCB7A;background:#FFF8E1}.pill.g{color:#1D7A44;border-color:#A7D9BB;background:#F1FAF4}

.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 100px)}
nav.side{background:var(--side);color:var(--side-ink);padding-bottom:30px}
.side .mod{background:var(--side2);padding:14px 14px;display:flex;gap:10px;align-items:center}.side .mod b{display:block}.side .mod small{font-size:10.5px;letter-spacing:.08em;color:#bbb;font-weight:700}

.ptitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.ptitle h1{font-size:24px;margin:0}.ptitle .sp{flex:1}
.psub{color:var(--ink2);margin:4px 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:3px;min-width:0}
.card.tb{border-top:3px solid var(--blue)}.card.tg{border-top-color:var(--green)}.card.ta{border-top-color:var(--amber)}.card.tr{border-top-color:var(--red)}.card.tt{border-top-color:var(--teal)}.card.tp{border-top-color:var(--purple)}
.ch{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}.ch h2{font-size:17px;margin:0}.ch .sp{flex:1}
.pad{padding:14px 16px}.stack{display:flex;flex-direction:column;gap:12px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row.end{align-items:flex-end}.sp{flex:1}.grow{flex:1;min-width:0}
.muted{color:var(--ink2)}.small{font-size:12.5px}.b7{font-weight:700}

.tile{background:#fff;border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:3px;padding:12px 14px;cursor:pointer;text-align:left}
.tile:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}.tile.on{outline:2px solid var(--blue)}
.tile small{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}.tile b{display:block;font-size:26px;line-height:1.3}.tile span{font-size:12px;color:var(--muted)}

.btn:hover{background:#F0F5FB}.btn.pri{background:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue-d)}

.chip.blue{background:var(--blue);color:#fff}.chip.green{background:var(--green);color:#fff}.chip.red{background:var(--red);color:#fff}.chip.purple{background:var(--purple);color:#fff}
.chip.lb{background:var(--b-blue);color:#244F80}.chip.lg{background:var(--b-green);color:#1D6B3E}.chip.la{background:var(--b-amber);color:#7A5300}.chip.lr{background:var(--b-red);color:#A1261D}.chip.lp{background:var(--b-purple);color:#6A2597}

.t td:first-child{white-space:nowrap}.t tr.click{cursor:pointer}.t tr.click:hover td{background:#F7F9FC}.t tr.on td{background:var(--sel)}.t tr.cito td:first-child{box-shadow:inset 4px 0 0 var(--red)}

.stg i{position:relative;z-index:1;display:grid;place-items:center;width:24px;height:24px;margin:0 auto 4px;border-radius:50%;background:#fff;border:2px solid var(--line);font-style:normal;font-weight:700;font-size:11px}
.stg.dn{color:var(--ink)}.stg.dn i{background:var(--green);border-color:var(--green);color:#fff}.stg.dn::before{background:var(--green)}
.stg.cur{color:var(--blue);font-weight:700}.stg.cur i{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 4px var(--b-blue)}.stg.cur::before{background:var(--green)}

.tree .sl{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:3px;padding:2px 8px;font-size:12.5px;background:#fff}
.bc{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:#F3F5F8;border-radius:3px;padding:1px 5px}
.timer{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.36);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px}
.modal{background:#fff;border-radius:4px;box-shadow:0 8px 32px rgba(0,0,0,.3);width:min(640px,100%);padding:20px;display:flex;flex-direction:column;gap:12px}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:14px;align-items:start}

.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.fl-h{color:var(--red);font-weight:700}.fl-l{color:#1F5FA8;font-weight:700}.t td.fl-cl{color:#fff;background:var(--red);font-weight:700}

 .burger{display:inline-flex}.search,.pill,.logo small,header.top .user{display:none}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.kv{grid-template-columns:minmax(0,1fr)}.main{padding:12px 16px 160px}}

  <div class="f" style="width:240px"><label for="srcF">Джерело направлення</label><select id="srcF" data-ch="srcF"><option value="all">Усі</option>${Object.entries(SRC).map(([k,v])=>`<option value="${k}"${S.srcF===k?' selected':''}>${v[0]}</option>`).join('')}</select></div>

 ${list.length?list.map(c=>`<tr class="click${c.cito?' cito':''}" data-a="openCase" data-id="${c.id}"><td><b class="link">${c.no}</b>${c.versions.length>1?' <span class="chip lp">v'+c.versions.length+'</span>':''}</td><td>${fmt(c.received)}</td><td>${P(c.pid).n}<div class="small muted">${age(P(c.pid).dob)} р. · ${P(c.pid).s==='Ж'?'жін.':'чол.'}</div></td><td><span class="chip ${KIND[c.kind][1]}">${KIND[c.kind][0]}</span>${c.ihcOrdered.length?' <span class="chip lp">ІГХ '+c.ihcOrdered.length+'</span>':''}</td><td><span class="chip ${SRC[c.src][1]}">${SRC[c.src][0]}</span></td><td>${esc(c.dept)}<div class="small muted">${esc(c.doctor)}</div></td><td>${blocksOf(c).length} / ${slidesOf(c).length}</td><td>${stageChip(c)}<div style="margin-top:4px">${mini(c)}</div></td><td>${c.kind==='CITO'&&c.stage!=='SIGNED'?'<span class="chip red">20 хв</span>':c.stage==='SIGNED'?fmt(c.signedAt).slice(0,10):overdue(c)?`<span class="chip lr">${due(c)}</span>`:due(c)}</td></tr>`).join(''):`<tr><td colspan="9" class="empty">За фільтрами справ немає</td></tr>`}
 </tbody></table></div>
 <div class="pad small muted row">${ic('info',14)}<span>Строки: біопсія — ${SLA.BIOPSY} роб. днів, операційний матеріал — ${SLA.OPER}, консультація — ${SLA.CONSULT}; ІГХ додає 3 дні; CITO — 20 хв від надходження. Колір рядка CITO — червона смуга.</span></div></section>`;}

   <div>Клінічний діагноз</div><div>${esc(x.ref.diag)}</div><div>Лікуючий лікар</div><div>${esc(x.ref.doctor)}</div></div></div>

function vCase(){

 let body='';if(S.ctab==='ref')body=tRef(c);else if(S.ctab==='gross')body=tGross(c);else if(S.ctab==='blocks')body=tBlocks(c);else if(S.ctab==='concl')body=tConcl(c);else if(S.ctab==='print')body=tPrint(c);else body=tHist(c);
 const nextBtn=['PROC','EMB','SECT','STAIN'].includes(c.stage)?`<button class="btn ok" data-a="nextStage" ${can('stage')?'':'disabled title="'+deny()+'"'}>${ic('scan')} Завершити «${STAGES[si][1]}»</button>`:'';

function tRef(c){const r=c.ref;

 <div class="row"><button class="btn" data-a="toast" data-m="Направнику (${esc(c.doctor)}) надіслано запит на уточнення; відповідь з’явиться в подіях справи.">${ic('send')} Запит направнику</button><button class="btn" data-a="ctab" data-t="print">${ic('print')} Друк 014/о</button></div></div>`;}

 ${ed?`<div class="row"><span class="sp"></span><button class="btn" data-a="toast" data-m="Надруковано ${blocksOf(c).length} етикеток касет (штрихкод = № справи + блок).">${ic('print')} Етикетки касет</button><button class="btn ok" data-a="finishGross" ${can('gross')&&blocksOf(c).length&&c.macro.trim()?'':'disabled'}>${ic('check')} Завершити вирізку → проводка</button></div>`:''}</div>`;}

 <div class="g4">${sel('k-topo',TOPO,k.topo,'МКХ-О: топографія')}${sel('k-morph',ICDO,k.morph,'МКХ-О: морфологія (гістотип /поведінка)')}${inp('k-icd10',k.icd10,'МКХ-10 (діагноз)','C50.4')}

 ${rf.length&&!signed?rf.map(r=>`<div class="al warn">${ic('bolt')}<div class="grow"><b>Reflex-правило:</b> ${esc(r.why)} (${esc(r.when)}). Пропонується панель: <b>${r.panel.join(', ')}</b> на блоці ${esc(blocksOf(c)[0]?.id||'')}.</div><button class="btn sm" data-a="orderIhc" data-p="${r.panel.join(',')}" ${can('concl')?'':'disabled'}>Дозамовити ІГХ</button></div>`).join(''):''}
